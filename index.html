<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scouting Program Ticker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="overlay">
    <section class="current-panel">
      <div class="brand">
        <span class="brand-dot"></span>
        <div>
          <strong>SCOUTING PROGRAM</strong>
          <small>MILNO TV · REDSTARS</small>
        </div>
      </div>

      <div class="current-hitter">
        <small>BATEADOR ACTUAL</small>
        <strong id="currentName">Esperando datos…</strong>
        <span>
          AVG <b id="currentAvg">---</b>
          <i>•</i>
          H <b id="currentHits">0</b>
          <i>•</i>
          PTS <b id="currentPoints">0</b>
        </span>
      </div>

      <div id="status" class="status">CONECTANDO</div>
    </section>

    <section class="ticker-frame">
      <div class="ticker-label">LINEUP</div>
      <div class="ticker-window">
        <div id="tickerTrack" class="ticker-track">
          <div class="ticker-message">Esperando jugadores de Google Sheets…</div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
